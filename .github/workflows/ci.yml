name: Validate EvidenceMesh
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: pytest -q
      - run: ruff check . && ruff format --check .
      - run: python scripts/export_schemas.py && git diff --exit-code -- schemas/
      - run: python -m engine.cli sample --db data/ci.sqlite3 --output data/report.json
      - run: python -m build
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth tshark
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck && npm run package
        working-directory: desktop
      - run: xvfb-run -a -s '-screen 0 1600x1100x24' npm run test:e2e
        working-directory: desktop
