name: Build and verify EvidenceMesh Windows

on:
  workflow_dispatch:
  push:
    branches: ["codex/v0.4.0", "release/v*"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows installer and installed application E2E
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.lock -r packaging/requirements-build.txt -e ".[dev]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $electronDist = "desktop\\node_modules\\electron\\dist"
          foreach ($required in @(
            "electron.exe",
            "LICENSE",
            "LICENSES.chromium.html",
            "version"
          )) {
            $candidate = Join-Path $electronDist $required
            if (-not (Test-Path $candidate)) {
              throw "Incomplete Electron installation: missing $required in $electronDist"
            }
          }
      - name: Check synchronized versions
        run: python scripts/sync_version.py --check
      - name: Acquire and verify offline TShark
        run: |
          python scripts/acquire_tshark.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$pwd\dist\tshark" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare inert and public compatibility fixtures
        run: python scripts/prepare_windows_fixtures.py
      - name: Python regression and format tests
        run: python -m pytest -q --junitxml=data/pytest-windows.xml
      - name: Ruff checks
        run: |
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check .
      - name: Collect corresponding sources and licenses
        run: python scripts/package_sources.py
      - name: Build frozen Python backend
        run: pyinstaller --noconfirm --clean packaging/backend.spec
      - name: Frozen backend health, data, plugins and shutdown
        timeout-minutes: 5
        run: python scripts/backend_smoke.py dist/evidencemesh-backend/evidencemesh-backend.exe --tshark dist/tshark/tshark.exe
      - name: TypeScript check
        working-directory: desktop
        run: npm run typecheck
      - name: Build Windows NSIS installer
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run package:win
      - name: Silent install, actual installed app, parsers, quit and uninstall
        timeout-minutes: 15
        run: node desktop/tests/installed-windows.cjs
      - name: Assemble release and SHA-256 manifest
        run: python scripts/assemble_release.py
      - name: Upload tested release assets
        uses: actions/upload-artifact@v4
        with:
          name: EvidenceMesh-Windows-x64
          path: dist/release-assets/*
          if-no-files-found: error
      - name: Upload validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvidenceMesh-Windows-validation
          path: |
            data/windows-e2e/
            data/pytest-windows.xml
            build/backend/warn-backend.txt
          if-no-files-found: warn

  release:
    name: Publish only tested installer and corresponding source
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: EvidenceMesh-Windows-x64
          path: release-assets
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            test "$GITHUB_REF_NAME" = "release/$tag"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          fi
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "EvidenceMesh $tag" --notes-file docs/RELEASE_NOTES_v04.md
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
