name: Build EvidenceMesh Windows

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run Python tests
        shell: pwsh
        run: |
          pytest -q

      - name: Build EvidenceMesh backend
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name evidencemesh-backend `
            --collect-data samples `
            --collect-data schemas `
            --collect-all volatility3 `
            --collect-all Evtx `
            --collect-all dissect.ntfs `
            --collect-all dissect.regf `
            api/launcher.py

      - name: Verify backend executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/evidencemesh-backend/evidencemesh-backend.exe")) {
            throw "Backend executable was not created"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: TypeScript check
        working-directory: desktop
        run: npm run typecheck

      - name: Build Electron
        working-directory: desktop
        run: npm run build

      - name: Build Windows installer
        working-directory: desktop
        run: npm run package:win

      - name: Show generated files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/release-installer

      - name: Upload EvidenceMesh installer
        uses: actions/upload-artifact@v4
        with:
          name: EvidenceMesh-Windows-x64
          path: |
            desktop/release-installer/*.exe
          if-no-files-found: error
