[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-mesh"
version = "0.3.0"
description = "Cross-source forensic correlation engine for memory, disk, and network evidence."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1.2,<2",
       "volatility3>=2.28,<3", "python-evtx>=0.8,<1", "dissect.ntfs>=3.16,<4", "dissect.regf>=3.14,<4"]
forensics = ["volatility3>=2.28,<3", "python-evtx>=0.8,<1", "dissect.ntfs>=3.16,<4", "dissect.regf>=3.14,<4"]

[project.scripts]
evidence-mesh = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "api*", "schemas*", "samples*"]

[tool.setuptools.package-data]
samples = ["sample_case/*.json", "cross_source/**/*", "cross_source/*.json", "cross_source/*.md"]
schemas = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
